[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmq-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tmq-core",
    "fastapi",
    "uvicorn[standard]",
    "litellm",
    "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
