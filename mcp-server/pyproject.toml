[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmq-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "tmq-core",
    "pandas<2.1",
]

[project.scripts]
tmq-mcp = "tmq_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
