[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmq-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "yfinance",
    "ccxt",
    "alpaca-py",
    "pandas",
    "numpy",
    "pydantic",
    "pandas-ta-classic",
    "vectorbt==0.28.1",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
